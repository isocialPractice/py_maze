# Build the documentation site in docs/ and publish it to GitHub Pages.
#
# The site is Markdown under one layout of our own, built by GitHub's own
# Jekyll action, so there is nothing to install here and nothing to install
# to work on the pages locally either. The push to main is what deploys:
# this workflow runs on it, and the repository's Pages source is set to
# GitHub Actions rather than to a branch.

name: Documentation site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and a queued one waits rather than cancelling the
# deploy already running
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure the Pages environment
        uses: actions/configure-pages@v5

      - name: Build the site from docs/
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
